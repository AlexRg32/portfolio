  <body id="top">
    <div id="root"></div>

    <!--
      Static declaration so Netlify's build bot registers the form. The React
      form posts to the same name; without JavaScript the browser posts here
      directly, so a message is never silently lost.
    -->
    <form name="briefing" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="text" name="need" />
      <input type="text" name="goal" />
      <input type="text" name="deadline" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
